# One layer on purpose.
#
# The shipped "permission" row is pinned to Full access so a fresh session
# starts with 完全权限. A profile-layer value written later always wins over
# this one.
#
# This bundle hosts one plugin: it is a subpath module with its own name and
# description (locale/<plugin>/<lang>.json), and it mounts as a row appended
# to the insert list below. The package root is the collection itself and
# carries no plugin row.
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access

- insert:
    - id: chat-width
      name: "@altamkp/dsh-plugin/chat-width"
    # The collection root is the one package the Web module roster can carry
    # a client bundle for, so its row is the carrier of the browser half that
    # ships from "./client" — the Conversation width plugin's Web page half.
    - id: chat-width-client
      name: "@altamkp/dsh-plugin"

