# Two layers on purpose.
#
# 1. Seed: the shipped "permission" row is pinned to Full access so a fresh
#    session starts with 完全权限 even before the plugin has stored anything.
#    A profile-layer value written later always wins over this one.
# 2. Plugin: default-permission/index.js records the level the user last
#    selected in a session's Permissions control and persists it as the new
#    default.
#
# This bundle hosts several plugins: each plugin is a subpath module with its
# own name and description (locale/<plugin>/<lang>.json), and every plugin
# mounts as a row appended to the insert list below. The package root is the
# collection itself and carries no plugin row.
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access

- insert:
    - id: default-permission
      name: "@altamkp/dsh-plugin/default-permission"
    - id: notifications
      name: "@altamkp/dsh-plugin/notifications"
      # Every field is optional and these are the defaults. A profile-level
      # patch for this row replaces the whole mapping, so restate the fields
      # you want to keep.
      config:
        appName: "DeepSeek Harness"
        events:
          completed: true
          question: true
          approval: true
          error: true
        suppressWhenFocused: true
        clickToFocus: true
        cooldownMs: 5000
        includeSubagents: false

